<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Send SMS</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <div id="container">
            <section id="body-header">
                <h1>Send SMS App - Custom Activity</h1>
                <h3>Configure the message that's going to be sent to the customer</h3>
            </section>
            <section id="body-content">
                <div id="attributes-container">
                    <div id="phone-attribute" class="input-wrapper column-flex">
                        <label for="phone-select">Phone attribute</label>
                        <select id="phone-select" name="phone" data-attribute="phone" data-type="static">
                            <option disabled selected value> -- select an option -- </option>
                        </select>
                    </div>
                </div>
                <div class="input-wrapper row-flex">
                    <input type="text" id="add-attribute-input" name="addAttribute" placeholder="Enter new attribute..." maxlength="25">
                    <button id="button-add" class="button-add" pattern="[A-Za-z]{3}">Add</button>
                </div>
                <div class="input-wrapper column-flex">
                    <label for="sms-message">SMS message</label>
                    <textarea id="sms-message" placeholder="Type the SMS message..." rows="8"></textarea>
                </div>    
            </section>
            <section id="body-footer">
                <button id="button-cancel" class="button-cancel">Cancel</button>
                <button id="button-submit" class="button-submit">Done</button>
            </section>
        </div>
        <!-- Load scripts -->
        <script src="/js/postmonger.js"></script>
        <script src="customActivity.js" type="module"></script>
    </body>
</html>
