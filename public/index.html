<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Send SMS</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <div id="container">
            <section id="body-header">
                <h1>Send SMS ENet - Custom Activity</h1>
                <h3>Configure the message that's going to be sent to the customer</h3>
            </section>
            <section id="body-content">
                <div class="inputWrapper">
                    <label for="key-select">Key attribute</label>
                    <select id="key-select" name="contactKey">
                        <option disabled selected value> -- select an option -- </option>
                    </select>
                </div>
                <div class="inputWrapper">
                    <label for="name-select">Name attribute</label>
                    <select id="name-select" name="name">
                        <option disabled selected value> -- select an option -- </option>
                    </select>
                </div>
                <div class="inputWrapper">
                    <label for="phone-select">Phone attribute</label>
                    <select id="phone-select" name="phone">
                        <option disabled selected value> -- select an option -- </option>
                    </select>
                </div>
                <div class="inputWrapper">
                    <label for="sms-message">SMS message</label>
                    <textarea id="sms-message" placeholder="SMS message..." rows="8"></textarea>
                </div>    
            </section>
            <section id="body-footer">
                <button id="button-cancel" class="button-cancel">Cancel</button>
                <button id="button-submit" class="button-submit">Done</button>
            </section>
        </div>
        <!-- Load scripts -->
        <script src="/js/postmonger.js"></script>
        <script src="customActivity.js" type="module"></script>
    </body>
</html>
