<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Send SMS</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <div id="container">
            <section id="body-header">
                <h1>Send SMS ENet - Custom Activity</h1>
                <h3>Configure the message that's going to be sent to the customer</h3>
            </section>
            <section id="body-content">
                <textarea id="sms-message" placeholder="SMS message..." rows="8"></textarea>
            </section>
            <section id="body-footer">
                <button id="button-submit" class="button-submit" disabled>Done</button>
            </section>
        </div>
        <!-- Load scripts -->
        <script src="/js/postmonger.js"></script>
        <script src="customActivity.js" type="module"></script>
    </body>
</html>
